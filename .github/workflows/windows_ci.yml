name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build && echo "Hello" > build/artifact.txt echo "<html><body><h1>CI Report</h1><p>Test Passed</p></body></html>" > build/artifact.html
      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: build/artifact.txt
          path: build/artifact.html
