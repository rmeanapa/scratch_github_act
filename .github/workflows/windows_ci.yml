name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y imagemagick libmagickwand-dev 
      - run: mkdir -p build && echo "Hello" > build/artifact.txt echo "<html><body><h1>CI Report</h1><p>Test Passed</p></body></html>" > build/artifact.html 
      - run:  magick -size 300x200 xc:gray build/img.jpg 
      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: build/img.jpg
