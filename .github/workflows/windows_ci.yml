name: Gnuplot Imaging
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Gnuplot
        run: sudo apt-get install -y gnuplot

      - name: Generate Plot
        run: |
          gnuplot -e "set terminal png; set output 'plot.png'; plot sin(x)"

      - name: Upload Plot
        uses: actions/upload-artifact@v4
        with:
          name: gnuplot-output
          path: plot.png
