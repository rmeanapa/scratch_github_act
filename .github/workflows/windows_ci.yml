on: [push]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        # This ensures all subsequent "run" steps use the MSYS2 bash shell
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64 # Modern Windows runtime (recommended)
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-jbigkit
            mingw-w64-ucrt-x86_64-mman-win32
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-libdeflate
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-openblas 
            mingw-w64-ucrt-x86_64-arpack
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pip
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          git clone https://github.com/hael/SIMPLE.git 
          cd SIMPLE
          ./compile_windows.sh
          export SIMPLE_EMAIL="my.name@uni.edu"
          export SIMPLE_QSYS="local"
          export SIMPLE_PATH="$GITHUB_WORKSPACE/SIMPLE/build"
          export PATH="$SIMPLE_PATH/scripts:$SIMPLE_PATH/bin:$PATH"
          echo "-------------------- TEST INSTALL -------------------------"
          simple_test_install
          echo "-------------------- TEST ANGRES -------------------------"
          simple_test_angres
          echo "-------------------- TEST ANSI COLORS -------------------------"
          simple_test_ansi_colors
          echo "-------------------- TEST BINORIS -------------------------"
          simple_test_binoris
          echo "-------------------- TEST BOUNDS FROM MASK3D -------------------------"
          simple_test_bounds_from_mask3D
          echo "-------------------- TEST COORS TO WEIGHTS -------------------------"
          simple_test_corrs2weights
          echo "-------------------- TEST CTF -------------------------"
          simple_test_ctf
          echo "-------------------- TEST EXTR FRAC -------------------------"
          simple_test_extr_frac
          echo "-------------------- TEST FILE INPUT OUTPUT IN PARALLEL-------------------------"
          simple_test_io_parallel
          echo "-------------------- TEST GRAPHENE MASK -------------------------"
          simple_test_graphene_mask
          echo "-------------------- TEST IMAGE FILE -------------------------"
          simple_test_imgfile
          echo "-------------------- TEST INSIDE WRITE -------------------------"
          simple_test_inside_write
          echo "-------------------- TEST INSTALL -------------------------"
          simple_test_install
          echo "-------------------- TEST INPUT OUTPUT -------------------------"
          simple_test_io
          echo "-------------------- TEST LPLIMS -------------------------"
          simple_test_lplims
          echo "-------------------- TEST MASK -------------------------"
          simple_test_mask
          echo "-------------------- TEST MULTIMODAL -------------------------"
          simple_test_multinomal
          echo "-------------------- TEST MASK ROUTINES -------------------------"
          simple_test_msk_routines
          echo "-------------------- TEST NEIGH -------------------------"
          simple_test_neigh
          echo "-------------------- TEST OPENMP -------------------------"
          simple_test_openmp
          echo "-------------------- TEST ORDER CORR -------------------------"
          simple_test_order_corr
          echo "-------------------- TEST ORI -------------------------"
          simple_test_ori
          echo "-------------------- TEST OTSU -------------------------"
          simple_test_otsu
          echo "-------------------- TEST PHASE CORR -------------------------"
          simple_test_phasecorr
          echo "-------------------- TEST RANK WEIGHTS -------------------------"
          simple_test_rank_weights
          echo "-------------------- TEST SERIALIZE -------------------------"
          simple_test_serialize
          echo "-------------------- TEST SIMD -------------------------"
          simple_test_simd
          echo "-------------------- TEST STRINGMATCH -------------------------"
          simple_test_stringmatch
          echo "-------------------- TEST SYM -------------------------"
          simple_test_sym
          echo "-------------------- TEST UNIFORM EULER -------------------------"
          simple_test_uniform_euler
          echo "-------------------- TEST UNIFORM ROT -------------------------"
          simple_test_uniform_rot
          echo "-------------------- TEST UNITS -------------------------"
          simple_test_units

      - name: Configure and Build NICE
        shell: msys2 {0}
        run: |
          git clone https://github.com/hael/SIMPLE.git 
          cd SIMPLE
          mkdir build
          cd build
          cmake -D NICE=ON -G "Unix Makefiles" ..
          make -j install
          export SIMPLE_EMAIL="my.name@uni.edu"
          export SIMPLE_QSYS="local"
          export SIMPLE_PATH="$GITHUB_WORKSPACE/SIMPLE/build"
          export PATH="$SIMPLE_PATH/scripts:$SIMPLE_PATH/bin:$PATH"
          nice_local


