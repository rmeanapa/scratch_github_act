name: CI
on:
  push:

jobs:
  test:
    run-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4
     - run: corepack enable
     - run: pnpm install
     - run: pnpm vitest run --reporter html
     - uses: actions/upload-artifact@v4
         if: always()
         with:
           name: test-report
           path: html
